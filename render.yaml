services:
  - type: web
    name: prompt-guard-backend
    runtime: python
    region: oregon
    plan: free
    # Root stays the repo root (not backend/) — backend/main.py imports the
    # ai_ml package as a sibling, so both must be on the same PYTHONPATH.
    #
    # IMPORTANT: installs ai_ml/requirements-runtime.txt, NOT the full
    # ai_ml/requirements.txt. The full file includes transformers (and
    # therefore torch) for local training — measured impact of having torch
    # merely INSTALLED in this same environment: spaCy's ML backend (thinc)
    # auto-imports it the moment presidio_analyzer/spacy are imported, even
    # though predict_ml() never touches it at runtime. That alone pushed
    # real memory usage to ~958MB on startup (measured via `ps`), instantly
    # exceeding the free plan's 512MB limit before serving a single request
    # — this was the actual cause of the repeated OOM/502s, not the earlier
    # concurrent-build race (that fix was real too, but insufficient alone).
    # With the runtime-only file, real startup memory measures ~172MB.
    # See DEPLOYMENT.md for the full incident writeup.
    #
    # NOTE: the trained DistilBERT checkpoint is gitignored (not in the repo
    # — see ai_ml/README.md), so predict_ml() uses the keyword-heuristic
    # fallback on a fresh deploy. Do NOT try to enable the real model on
    # this plan by installing the full requirements file or adding torch
    # back — there isn't enough free-tier memory headroom for an actual
    # loaded DistilBERT model on top of Presidio+spaCy. That requires
    # upgrading off the free plan.
    buildCommand: >
      pip install -r backend/requirements.txt -r ai_ml/requirements-runtime.txt &&
      python -m spacy download en_core_web_sm
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_EXTRA_ORIGINS
        value: https://YOUR-VERCEL-APP.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.15
    # No persistent disk on the free plan — Render's free tier doesn't
    # support them, and attaching one forces the Blueprint to a paid plan.
    # SQLite lives on the default ephemeral filesystem instead: the event
    # log resets on every redeploy/restart (fine for a demo; not durable).
    # If you upgrade to a paid plan later, add a disk and set DB_PATH to a
    # path under its mount (see git history for the exact block removed
    # here) to make logging persistent.
